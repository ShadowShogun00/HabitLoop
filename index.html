<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>HabitLoop</title>
</head>
<body>

<div class="calhabit">

    <!-- CALENDAR START -->
    <div class="calendar">

        <div class="nav">
            <button class="nav-btn"><</button>

            <select class="month-select">
                <option>January</option>
                <option>February</option>
                <option>March</option>
                <option>April</option>
                <option>May</option>
                <option>June</option>
                <option>July</option>
                <option>August</option>
                <option>September</option>
                <option>October</option>
                <option>November</option>
                <option>December</option>
            </select>

            <select class="year-select">
                <option>2025</option>
                <option>2026</option>
                <option>2027</option>
            </select>

            <button class="nav-btn">></button>
        </div>

        <table class="calendar-table">
            <thead>
                <tr>
                    <th>Su</th><th>Mo</th><th>Tu</th><th>We</th><th>Th</th><th>Fr</th><th>Sa</th>
                </tr>
            </thead>

            <tbody>
                <tr><td></td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td></tr>
                <tr><td>7</td><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td><td>13</td></tr>
                <tr><td>14</td><td>15</td><td>16</td><td>17</td><td>18</td><td>19</td><td>20</td></tr>
                <tr><td>21</td><td>22</td><td>23</td><td>24</td><td>25</td><td>26</td><td>27</td></tr>
                <tr><td>28</td><td>29</td><td>30</td><td class="gray">1</td><td class="gray">2</td><td class="gray">3</td><td class="gray">4</td></tr>
            </tbody>
        </table>

    </div>
    <!-- CALENDAR END -->

    <!-- NEW HABIT START -->
    <div class="habits-box">
        <h2 class="title">HABITS</h2>
        <button class="add-btn">+ New Habit</button>
        <div class="divider"></div>
        <div class="habits-list">
            <!-- Habit items will appear here -->
        </div>
    </div>
    <!-- NEW HABIT END -->

</div> 

<!-- HABIT FORM -->
<div>
    <form class="habit-form">
        <div class="habit-name">
            <label for="habit-name" class="habit-nametext">Habit Name:</label>
            <input type="text" id="habit-name" name="habit-name" placeholder="Enter the new habit">
        </div>
        <div class="habit-formbtn">
            <button class="sub-btn">Submit</button>
            <button class="can-btn">Cancel</button>
        </div>
    </form>
</div>
<!-- HABIT FORM END -->
<!--monthly progress-->
<div class=" monthlycontainer">

        <h2 class="title">Month Progress</h2>

        <div class="months-grid">

            <!-- Month Card Template (repeat for 12 months) -->
            <div class="month-card">
                <div class="month-header">
                    <span class="icon">📅</span>
                    <span class="month-name">January</span>
                </div>
                <div class="progress">
                    <div class="dots">
                        <span></span><span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                    <span class="percent">0%</span>
                </div>
            </div>

            <div class="month-card"><div class="month-header"><span class="icon">📅</span><span class="month-name">February</span></div><div class="progress"><div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><span class="percent">0%</span></div></div>

            <div class="month-card"><div class="month-header"><span class="icon">📅</span><span class="month-name">March</span></div><div class="progress"><div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><span class="percent">0%</span></div></div>

            <div class="month-card"><div class="month-header"><span class="icon">📅</span><span class="month-name">April</span></div><div class="progress"><div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><span class="percent">0%</span></div></div>

            <div class="month-card"><div class="month-header"><span class="icon">📅</span><span class="month-name">May</span></div><div class="progress"><div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><span class="percent">0%</span></div></div>

            <div class="month-card"><div class="month-header"><span class="icon">📅</span><span class="month-name">June</span></div><div class="progress"><div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><span class="percent">0%</span></div></div>

            <div class="month-card"><div class="month-header"><span class="icon">📅</span><span class="month-name">July</span></div><div class="progress"><div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><span class="percent">0%</span></div></div>

            <div class="month-card"><div class="month-header"><span class="icon">📅</span><span class="month-name">August</span></div><div class="progress"><div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><span class="percent">0%</span></div></div>

            <div class="month-card"><div class="month-header"><span class="icon">📅</span><span class="month-name">September</span></div><div class="progress"><div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><span class="percent">0%</span></div></div>

            <div class="month-card"><div class="month-header"><span class="icon">📅</span><span class="month-name">October</span></div><div class="progress"><div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><span class="percent">0%</span></div></div>

            <div class="month-card"><div class="month-header"><span class="icon">📅</span><span class="month-name">November</span></div><div class="progress"><div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><span class="percent">0%</span></div></div>

            <div class="month-card"><div class="month-header"><span class="icon">📅</span><span class="month-name">December</span></div><div class="progress"><div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><span class="percent">0%</span></div></div>

        </div>

    </div>

<script src="script.js"></script>
</body>
</html>
